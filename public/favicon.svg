<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="oceanBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2D6F7E" />
      <stop offset="60%" stop-color="#245A66" />
      <stop offset="100%" stop-color="#14363E" />
    </radialGradient>

    <!-- Spiral Arm Gradient 1 -->
    <linearGradient id="spiralGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2F1F3" />
      <stop offset="85%" stop-color="#6DB1BD" />
      <stop offset="100%" stop-color="#245A66" stop-opacity="0" />
    </linearGradient>

    <!-- Spiral Arm Gradient 2 -->
    <linearGradient id="spiralGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CFE7EA" />
      <stop offset="85%" stop-color="#4C96A3" />
      <stop offset="100%" stop-color="#245A66" stop-opacity="0" />
    </linearGradient>

    <!-- Eye Core Glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="55%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#oceanBg)" filter="url(#badgeShadow)" />
  
  <!-- Outer Compass / Latitude Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="64" cy="64" r="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

  <!-- Tropical Cyclone Arm 1 (Northern Counter-Clockwise Spiral) -->
  <path d="M 64 24 
           C 88 24, 104 42, 102 65 
           C 100 83, 84 96, 68 94 
           C 56 92, 48 83, 50 72 
           C 52 63, 60 56, 68 59 
           C 74 61, 76 68, 72 73 
           C 70 76, 66 76, 64 74 
           C 62 72, 63 68, 66 67 
           C 76 67, 86 78, 81 92 
           C 74 106, 50 106, 36 94 
           C 20 80, 24 50, 46 34 
           C 52 30, 58 26, 64 24 Z" 
        fill="url(#spiralGrad1)" />

  <!-- Tropical Cyclone Arm 2 (Counter-balancing Inward Swirl / Ocean Wave Crest) -->
  <path d="M 64 104 
           C 40 104, 24 86, 26 63 
           C 28 45, 44 32, 60 34 
           C 72 36, 80 45, 78 56 
           C 76 65, 68 72, 60 69 
           C 54 67, 52 60, 56 55 
           C 58 52, 62 52, 64 54 
           C 66 56, 65 60, 62 61 
           C 52 61, 42 50, 47 36 
           C 54 22, 78 22, 92 34 
           C 108 48, 104 78, 82 94 
           C 76 98, 70 102, 64 104 Z" 
        fill="url(#spiralGrad2)" />

  <!-- Calm Eye Center Ring -->
  <circle cx="64" cy="64" r="13" fill="#14363E" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Radar Eye of the Cyclone (Amber Surveillance Core) -->
  <circle cx="64" cy="64" r="7" fill="url(#eyeGlow)" />
  <circle cx="64" cy="64" r="2.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Subtle Cardinal Ticks (North/South/East/West) -->
  <line x1="64" y1="6" x2="64" y2="11" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="117" x2="64" y2="122" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  <line x1="6" y1="64" x2="11" y2="64" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  <line x1="117" y1="64" x2="122" y2="64" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
</svg>
